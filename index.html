<!DOCTYPE html>
<html>
<head>
    <title>Cut It Right | Attendance</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 500px;
            margin: 0 auto;
            padding: 20px;
            background: #f0f9ff;
        }
        .card {
            background: white;
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        select, button {
            width: 100%;
            padding: 14px;
            margin: 8px 0;
            border-radius: 12px;
            font-size: 16px;
        }
        button {
            background: #a3e635;
            border: none;
            font-weight: bold;
            cursor: pointer;
        }
        .status {
            padding: 12px;
            border-radius: 12px;
            text-align: center;
            font-weight: bold;
            margin: 10px 0;
        }
        .green { background: #dcfce7; color: #166534; }
        .orange { background: #fed7aa; color: #9a3412; }
        .gray { background: #f1f5f9; color: #475569; }
    </style>
</head>
<body>
    <div class="card">
        <h2>⏰ Employee Attendance</h2>
        <select id="employeeSelect">
            <option value="">-- Select Employee --</option>
            <option value="Lisakhanya Mei">Lisakhanya Mei</option>
            <option value="Nkululeko Adonisi">Nkululeko Adonisi</option>
            <option value="Mei Mziwovuyo">Mei Mziwovuyo</option>
        </select>
        
        <div id="statusDisplay" class="status gray">❌ Not Clocked In</div>
        
        <button id="clockInBtn" onclick="recordAction('clockin')">🔵 CLOCK IN</button>
        <button id="clockOutBtn" onclick="recordAction('clockout')" disabled>🔴 CLOCK OUT</button>
        <button id="breakStartBtn" onclick="recordAction('breakstart')" disabled>☕ BREAK START</button>
        <button id="breakEndBtn" onclick="recordAction('breakend')" disabled>✅ BREAK END</button>
    </div>
    
    <div class="card">
        <h3>Today's Activity</h3>
        <div id="todayHistory">Select employee</div>
    </div>

    <script>
        // YOUR APPS SCRIPT URL
        const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzkieBin4PuWwhc6trnTljgBO17VAzMdW_yg0_bgyvhwF-ClJcMnfrQ9PeKSUJQjz4B/exec';
        
        let currentEmployee = '';
        let records = [];
        
        // Load saved data from localStorage (instant, no waiting)
        function loadLocalData() {
            const saved = localStorage.getItem('attendance_data');
            if (saved) {
                records = JSON.parse(saved);
            } else {
                records = [];
            }
            updateUI();
            
            // Try to sync with Google Sheets in background
            syncToSheet();
        }
        
        function saveLocalData() {
            localStorage.setItem('attendance_data', JSON.stringify(records));
        }
        
        function getToday() {
            return new Date().toISOString().split('T')[0];
        }
        
        function getTime() {
            return new Date().toLocaleTimeString();
        }
        
        function updateUI() {
            const select = document.getElementById('employeeSelect');
            currentEmployee = select.value;
            
            if (!currentEmployee) {
                document.getElementById('statusDisplay').innerHTML = '❌ Select employee';
                return;
            }
            
            const today = getToday();
            const todayRecord = records.find(r => r.name === currentEmployee && r.date === today);
            const isClockedIn = todayRecord && todayRecord.clockIn && !todayRecord.clockOut;
            const isOnBreak = isClockedIn && todayRecord.breakStart && !todayRecord.breakEnd;
            
            const statusDiv = document.getElementById('statusDisplay');
            const clockInBtn = document.getElementById('clockInBtn');
            const clockOutBtn = document.getElementById('clockOutBtn');
            const breakStartBtn = document.getElementById('breakStartBtn');
            const breakEndBtn = document.getElementById('breakEndBtn');
            
            if (isClockedIn) {
                if (isOnBreak) {
                    statusDiv.innerHTML = `☕ ON BREAK (Clocked in at ${todayRecord.clockIn})`;
                    statusDiv.className = 'status orange';
                    clockInBtn.disabled = true;
                    clockOutBtn.disabled = false;
                    breakStartBtn.disabled = true;
                    breakEndBtn.disabled = false;
                } else {
                    statusDiv.innerHTML = `✅ CLOCKED IN (Since ${todayRecord.clockIn})`;
                    statusDiv.className = 'status green';
                    clockInBtn.disabled = true;
                    clockOutBtn.disabled = false;
                    breakStartBtn.disabled = false;
                    breakEndBtn.disabled = true;
                }
            } else {
                statusDiv.innerHTML = '❌ NOT CLOCKED IN';
                statusDiv.className = 'status gray';
                clockInBtn.disabled = false;
                clockOutBtn.disabled = true;
                breakStartBtn.disabled = true;
                breakEndBtn.disabled = true;
            }
            
            updateTodayHistory();
        }
        
        function updateTodayHistory() {
            const container = document.getElementById('todayHistory');
            if (!currentEmployee) {
                container.innerHTML = 'Select employee';
                return;
            }
            
            const today = getToday();
            const record = records.find(r => r.name === currentEmployee && r.date === today);
            
            if (!record) {
                container.innerHTML = 'No activity today';
                return;
            }
            
            container.innerHTML = `
                <strong>Clock In:</strong> ${record.clockIn || '-'}<br>
                <strong>Clock Out:</strong> ${record.clockOut || 'Still in'}<br>
                <strong>Break Start:</strong> ${record.breakStart || '-'}<br>
                <strong>Break End:</strong> ${record.breakEnd || '-'}
            `;
        }
        
        async function recordAction(action) {
            if (!currentEmployee) {
                alert('Please select employee first');
                return;
            }
            
            const today = getToday();
            const time = getTime();
            let record = records.find(r => r.name === currentEmployee && r.date === today);
            
            if (!record) {
                record = {
                    name: currentEmployee,
                    date: today,
                    clockIn: null,
                    clockOut: null,
                    breakStart: null,
                    breakEnd: null
                };
                records.push(record);
            }
            
            // Update local record
            if (action === 'clockin') {
                if (record.clockIn && !record.clockOut) {
                    alert('Already clocked in!');
                    return;
                }
                record.clockIn = time;
                showMsg(`✅ Clocked in at ${time}`);
            } 
            else if (action === 'clockout') {
                if (!record.clockIn) {
                    alert('Not clocked in yet!');
                    return;
                }
                if (record.clockOut) {
                    alert('Already clocked out!');
                    return;
                }
                record.clockOut = time;
                showMsg(`✅ Clocked out at ${time}`);
            }
            else if (action === 'breakstart') {
                if (!record.clockIn) {
                    alert('Clock in first!');
                    return;
                }
                if (record.breakStart && !record.breakEnd) {
                    alert('Already on break!');
                    return;
                }
                record.breakStart = time;
                showMsg(`☕ Break started at ${time}`);
            }
            else if (action === 'breakend') {
                if (!record.breakStart) {
                    alert('No break started!');
                    return;
                }
                if (record.breakEnd) {
                    alert('Break already ended!');
                    return;
                }
                record.breakEnd = time;
                showMsg(`✅ Break ended at ${time}`);
            }
            
            saveLocalData();
            updateUI();
            
            // Send to Google Sheets in background (won't break buttons)
            sendToSheet(action, time);
        }
        
        async function sendToSheet(action, time) {
            try {
                const response = await fetch(APPS_SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        name: currentEmployee,
                        action: action,
                        time: time,
                        date: getToday()
                    })
                });
                console.log('Background sync sent');
            } catch(e) {
                console.log('Background sync failed - data saved locally');
            }
        }
        
        async function syncToSheet() {
            // Get unsynced records and send them
            const unsynced = records.filter(r => !r.synced);
            for (const record of unsynced) {
                if (record.clockIn && !record.syncedClockIn) {
                    await sendToSheet('clockin', record.clockIn);
                    record.syncedClockIn = true;
                }
                if (record.clockOut && !record.syncedClockOut) {
                    await sendToSheet('clockout', record.clockOut);
                    record.syncedClockOut = true;
                }
            }
            record.synced = true;
            saveLocalData();
        }
        
        function showMsg(msg) {
            const msgDiv = document.getElementById('attendanceMsg');
            if (!msgDiv) {
                const div = document.createElement('div');
                div.id = 'attendanceMsg';
                div.style.cssText = 'position:fixed; bottom:20px; left:20px; right:20px; background:#4caf50; color:white; padding:12px; border-radius:12px; text-align:center; z-index:1000';
                document.body.appendChild(div);
            }
            const div = document.getElementById('attendanceMsg');
            div.textContent = msg;
            div.style.display = 'block';
            setTimeout(() => div.style.display = 'none', 2000);
        }
        
        document.getElementById('employeeSelect').addEventListener('change', () => {
            loadLocalData();
        });
        
        loadLocalData();
    </script>
</body>
</html>
